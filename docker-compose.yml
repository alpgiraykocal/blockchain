services:
  app:
    build: .
    image: blockchain-analysis
    restart: unless-stopped
    ports:
      # Bound to loopback: Cloudflare Tunnel reaches it from the same host, and
      # nothing else should reach it directly. Change to "3000:3000" only if you
      # are terminating TLS yourself.
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: https://blockchain.alpgiraykocal.com
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      start_period: 20s
      retries: 3
